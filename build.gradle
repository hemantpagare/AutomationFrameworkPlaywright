plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.automation.core'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // Playwright
    implementation 'com.microsoft.playwright:playwright:1.44.0'

    // Cucumber
    implementation 'io.cucumber:cucumber-java:7.17.0'
    implementation 'io.cucumber:cucumber-junit-platform-engine:7.17.0'

    // JUnit 5 Platform
    testImplementation 'org.junit.platform:junit-platform-suite:1.10.2'
    implementation 'org.junit.jupiter:junit-jupiter:5.10.2'

    // Excel Handling (Apache POI)
    implementation 'org.apache.poi:poi-ooxml:5.2.3'

    // Logging (SLF4J + Logback)
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'ch.qos.logback:logback-classic:1.5.6'

    // REST Assured / API Support
    implementation 'io.rest-assured:rest-assured:5.4.0'
    // Jakarta Mail for email report sender
    implementation 'com.sun.mail:jakarta.mail:2.0.1'
    //extent report
    implementation 'tech.grasshopper:extentreports-cucumber7-adapter:1.14.0'
}

test {
    useJUnitPlatform()
    systemProperties(System.getProperties())
}
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}